[project]
name = "time-series"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mahdi Ghafarian", email = "mahdi.ghaf@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "streamlit>=1.66.0",
    "yfinance>=1.7.0",
]

[project.scripts]
time-series = "time_series:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
